name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Start SFTP server (SFG stand-in)
        run: docker run -d --name sftp -p 2222:22 atmoz/sftp:alpine sfg:sfgpass:::inbound
      - name: Restore
        run: dotnet restore AlipaySettlement.sln
      - name: Lint
        run: dotnet format AlipaySettlement.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build AlipaySettlement.sln --no-restore -c Release
      - name: Validate config
        run: dotnet run --project src/Settlement.Agent -c Release --no-build -- validate-config
      - name: Test
        env:
          SFTP_TEST_HOST: localhost
          SFTP_TEST_PORT: "2222"
          SFTP_TEST_USER: sfg
          SFTP_TEST_PASSWORD: sfgpass
        run: dotnet test AlipaySettlement.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
      - name: Demo run
        run: ./scripts/demo.sh -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settlement-reports
          path: |
            data/reports
            tests/**/TestResults/*.trx
